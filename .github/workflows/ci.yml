name: Local foundation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routevela-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run test:core
      - name: Verify the current evidence scope
        run: node -e "const fs=require('node:fs'),cp=require('node:child_process');const local=fs.existsSync('evidence/P02.json');const run=cp.spawnSync(process.execPath,['tools/evidence.mjs',local?'verify-local':'verify',local?'P02':'P01'],{stdio:'inherit'});process.exit(run.status??1)"
